# =============================================================================
# VideOCR Recreated — Build & Release
#
# Triggers automatically whenever a tag is pushed.
#
# Builds (via the existing build.py: Nuitka compile + 7-Zip packaging +
# Inno Setup installer, WITHOUT code signing — --signtool is never passed):
#
#   Windows : cpu, gpu-cuda11.8, gpu-cuda12.9, gpu-directml
#   Linux   : cpu, gpu-cuda11.8, gpu-cuda12.9
#             (gpu-directml intentionally omitted — DirectML is Windows-only
#              and build.py rejects it on Linux)
#
# The build jobs upload their archives (.7z, split volumes, Windows
# installers) as workflow artifacts. Once ALL builds finish, a final job
# downloads them, generates the release notes from the actual uploaded
# assets, and only then creates the draft release with the assets attached.
# =============================================================================
name: Build and Release

on:
  push:
    tags:
      - "*" # run for any new tag (v1.6.0, 1.6.0, ...)

permissions:
  contents: write # create the release
  actions: write # upload/download workflow artifacts (release assets)

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12" # recommended by README (torch-directml needs <3.13)

jobs:
  # ---------------------------------------------------------------------------
  # 1. Windows builds: CPU, CUDA 11.8, CUDA 12.9, DirectML
  # ---------------------------------------------------------------------------
  build-windows:
    name: Windows / ${{ matrix.target }}
    runs-on: windows-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        target: [cpu, gpu-cuda11.8, gpu-cuda12.9, gpu-directml]
    env:
      BUILD_TARGET: ${{ matrix.target }}
      NUITKA_ASSUME_YES_FOR_DOWNLOADS: "1"
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install 7-Zip and Inno Setup
        run: choco install 7zip innosetup -y --no-progress

      - name: Download and install all Inno Setup languages
        run: |
          $langDir = "C:\Program Files (x86)\Inno Setup 6\Languages"
          if (-not (Test-Path $langDir)) {
              $langDir = "C:\Program Files\Inno Setup 6\Languages"
          }
          Write-Host "Cloning Inno Setup source repository to get all language files..."
          # Use --depth 1 for a fast shallow clone
          git clone --depth 1 https://github.com/jrsoftware/issrc.git C:\temp\issrc
          # Copy both official and Unofficial language files to ensure none are missing
          $officialDir = "C:\temp\issrc\Files\Languages"
          $unofficialDir = "C:\temp\issrc\Files\Languages\Unofficial"
          if (Test-Path $officialDir) {
              Copy-Item "$officialDir\*.isl" $langDir -Force -ErrorAction SilentlyContinue
          }
          if (Test-Path $unofficialDir) {
              Copy-Item "$unofficialDir\*.isl" $langDir -Force -ErrorAction SilentlyContinue
          }
          Write-Host "Successfully populated Inno Setup languages folder."
        shell: pwsh

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          # Base deps + AMD DirectML backend (easyocr, torch-directml, ONNX
          # Runtime DirectML). Installed for EVERY Windows target so the
          # Nuitka standalone bundle always contains the full engine set —
          # this mirrors building all targets from one environment locally.
          python -m pip install ".[directml]"
          # Build tooling used by build.py (Nuitka compiler, downloads).
          python -m pip install nuitka requests
          # Ensure the DirectML build of ONNX Runtime wins over plain
          # onnxruntime pulled in by the unified rapidocr package.
          python -m pip uninstall -y onnxruntime onnxruntime-directml
          python -m pip install --no-cache-dir onnxruntime-directml
          # SymPy/mpMath pins from the README (torch-directml compatibility).
          python -m pip install --force-reinstall --no-cache-dir "sympy==1.13.3" "mpmath==1.3.0"

      - name: Verify critical dependencies (Fail fast if missing)
        shell: bash
        run: |
          # If this fails, Nuitka would build a broken exe. Catch it in 5 seconds instead of 2 hours.
          python -c "import sympy; print('SymPy OK:', sympy.__version__)"
          python -c "import onnxruntime as ort; providers = ort.get_available_providers(); print('ONNX Providers:', providers); assert 'DmlExecutionProvider' in providers, 'DmlExecutionProvider missing!'"
          python -c "import torch_directml; print('torch-directml OK')"

      - name: Restore Nuitka cache
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\Nuitka
          key: nuitka-win-${{ hashFiles('VideOCR_qt.py', '_version.py', 'videocr_gui/**', 'CLI/**') }}
          restore-keys: nuitka-win-

      - name: Compile and package (Nuitka + 7-Zip + Inno Setup)
        run: |
          # NOTE: code signing is intentionally NOT performed here
          # (build.py only signs when --signtool/--sign-cert-name are given).
          $candidates = @(
            'C:\Program Files (x86)\Inno Setup 6\ISCC.exe',
            'C:\Program Files\Inno Setup 6\ISCC.exe'
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { $iscc = (Get-Command iscc.exe -ErrorAction SilentlyContinue).Source }
          if (-not $iscc) { throw 'Inno Setup compiler (ISCC.exe) was not found.' }

          python build.py `
            --target $env:BUILD_TARGET `
            --archive true `
            --windows-installer true `
            --gui-only true `
            --iscc $iscc

          if ($LASTEXITCODE -ne 0) { throw "build.py failed with exit code $LASTEXITCODE" }

      - name: Split archives larger than the 2 GB release-asset limit
        run: |
          # GitHub rejects release assets > 2 GB. Re-archive oversized .7z
          # files into 1950 MB volumes (same approach build.py uses for
          # Linux CUDA 12.9).
          $limit = 1950MB
          Get-ChildItem -Path Releases -Filter *.7z -File |
            Where-Object Length -gt $limit |
            ForEach-Object {
              $folder = Join-Path Releases $_.BaseName
              if (Test-Path $folder) {
                Write-Host "Splitting $($_.Name) into 1950 MB volumes..."
                Remove-Item $_.FullName
                Push-Location Releases
                & 7z a -t7z -mx=7 -m0=lzma2 -md=64m -mfb=64 -ms=on -v1950m $_.Name $_.BaseName
                $code = $LASTEXITCODE
                Pop-Location
                if ($code -ne 0) { throw "7z failed while splitting $($_.Name)" }
              }
            }

      - name: Free disk space
        run: |
          Get-ChildItem -Path Releases -Directory | Remove-Item -Recurse -Force
          Remove-Item -Recurse -Force VideOCR_qt.build, CLI\videocr_cli.build -ErrorAction SilentlyContinue

      - name: Set aside oversized installers
        run: |
          # A single-file installer cannot be split; keep it out of the
          # upload instead of failing the asset upload.
          Get-ChildItem -Path Releases -Filter *.exe -File |
            Where-Object Length -gt 1990MB |
            ForEach-Object {
              Write-Warning "$($_.Name) exceeds 2 GB and cannot be attached to the release."
              New-Item -ItemType Directory -Force -Path Releases\oversized | Out-Null
              Move-Item $_.FullName (Join-Path Releases\oversized $_.Name)
            }

      - name: Show final release assets
        run: Get-ChildItem -Path Releases -File | Format-Table Name, @{n='SizeMB';e={[math]::Round($_.Length/1MB,1)}}

      # Upload this build leg's release files as one workflow artifact. The
      # final job downloads them all (merge-multiple) and attaches them to the
      # draft release. Per-artifact cap is 10 GB — a single leg stays well under.
      - name: Upload release assets as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: assets-windows-${{ matrix.target }}
          path: |
            Releases/*.7z
            Releases/*.7z.0*
            Releases/*.exe
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 2. Linux builds: CPU, CUDA 11.8, CUDA 12.9  (NO DirectML — Windows-only)
  # ---------------------------------------------------------------------------
  build-linux:
    name: Linux / ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        target: [cpu, gpu-cuda11.8, gpu-cuda12.9]
    env:
      BUILD_TARGET: ${{ matrix.target }}
      NUITKA_ASSUME_YES_FOR_DOWNLOADS: "1"
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install system packages
        run: |
          sudo apt-get update
          # build.py expects a `7z` binary on PATH.
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y p7zip-full \
            || { sudo DEBIAN_FRONTEND=noninteractive apt-get install -y 7zip && sudo ln -sf "$(command -v 7zz)" /usr/local/bin/7z; }
          # Qt runtime libs so PySide6 can be imported during Nuitka compilation.
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            libgl1 libegl1 libopengl0 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0 \
            || sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
               libgl1 libegl1 libopengl0 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0t64

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install .
          python -m pip install nuitka requests patchelf

      - name: Clean PySide6 QML artifacts
        run: |
          python - <<'PY'
          import shutil
          from pathlib import Path
          import PySide6
          for d in Path(PySide6.__file__).resolve().parent.rglob("objects-*"):
              if d.is_dir():
                  shutil.rmtree(d, ignore_errors=True)
                  print(f"Removed {d}")
          PY

      - name: Restore Nuitka cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/Nuitka
          key: nuitka-linux-${{ hashFiles('VideOCR_qt.py', '_version.py', 'videocr_gui/**', 'CLI/**') }}
          restore-keys: nuitka-linux-

      - name: Compile and package (Nuitka + 7-Zip)
        run: |
          python build.py \
            --target "$BUILD_TARGET" \
            --archive true \
            --gui-only true

      - name: Split archives larger than the 2 GB release-asset limit
        run: |
          # Linux CUDA 12.9 is already split by build.py (-v1999m); this is a
          # safety net for any other oversized archive.
          LIMIT=$((1950 * 1024 * 1024))
          for archive in Releases/*.7z; do
            [ -f "$archive" ] || continue
            size=$(stat -c%s "$archive")
            name=$(basename "$archive")
            folder="Releases/${name%.7z}"
            if [ "$size" -gt "$LIMIT" ] && [ -d "$folder" ]; then
              echo "Splitting $name into 1950 MB volumes..."
              rm "$archive"
              (cd Releases && 7z a -t7z -mx=7 -m0=lzma2 -md=64m -mfb=64 -ms=on -v1950m "$name" "${name%.7z}")
            fi
          done

      - name: Free disk space
        run: |
          find Releases -mindepth 1 -maxdepth 1 -type d -exec rm -rf {} +
          rm -rf VideOCR_qt.build CLI/videocr_cli.build

      - name: Show final release assets
        run: ls -lh Releases

      - name: Upload release assets as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: assets-linux-${{ matrix.target }}
          path: |
            Releases/*.7z
            Releases/*.7z.0*
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 3. Create the draft release ONLY after all builds have finished.
  #    Downloads every build artifact, generates the release notes from the
  #    actual uploaded assets, then creates the draft with assets attached.
  # ---------------------------------------------------------------------------
  create-release:
    name: Create draft release
    needs: [build-windows, build-linux]
    # Runs after ALL builds finish. Creates the draft even if only one build
    # succeeded (matrix legs can fail independently); skips when every build
    # failed or was cancelled/skipped, so no empty/partial release is created.
    if: >-
      always() &&
      needs.build-windows.result != 'failure' &&
      needs.build-linux.result != 'failure' &&
      (needs.build-windows.result == 'success' ||
       needs.build-linux.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for the changelog

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: assets-*
          path: releases
          merge-multiple: true

      - name: Show collected release assets
        run: |
          ls -lh releases
          # Guard: never create a release from an empty asset set.
          if ! ls -1 releases/* >/dev/null 2>&1; then
            echo "ERROR: no release assets were downloaded; aborting." >&2
            exit 1
          fi

      - name: Generate release notes from actual assets
        env:
          TAG: ${{ github.ref_name }}
        run: |
          ls -1 releases > "$RUNNER_TEMP/assets.txt"
          echo "Collected $(wc -l < "$RUNNER_TEMP/assets.txt") assets."
          # Best-effort previous tag for the changelog range.
          PREV_TAG="$(git tag --sort=-version:refname | sed -n '2p' || true)"
          ARGS=()
          if [ -n "$PREV_TAG" ] && [ "$PREV_TAG" != "$TAG" ]; then
            ARGS+=(--prev-tag "$PREV_TAG")
          fi
          python tools/generate_release_notes.py \
            --tag "$TAG" \
            --repo "${{ github.repository }}" \
            --assets-file "$RUNNER_TEMP/assets.txt" \
            --out "$RUNNER_TEMP/RELEASE_NOTES.md" \
            "${ARGS[@]}"

      - name: Create draft release with assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release create "$TAG" \
               releases/* \
               --draft \
               --title "VideOCR Recreated $TAG" \
               --notes-file "$RUNNER_TEMP/RELEASE_NOTES.md" 2>"$RUNNER_TEMP/gh_err.txt"; then
            echo "Draft release created for $TAG with all assets."
          elif grep -qi "already exists" "$RUNNER_TEMP/gh_err.txt"; then
            # Re-runs of this workflow hit the draft from the first attempt.
            echo "Draft release for $TAG already exists — re-attaching missing assets."
            # Re-upload every local asset; --clobber makes this idempotent, so
            # a partial first attempt self-heals on re-run.
            gh release upload "$TAG" releases/* --clobber
          else
            echo "ERROR: gh release create failed for $TAG:" >&2
            cat "$RUNNER_TEMP/gh_err.txt" >&2
            exit 1
          fi
